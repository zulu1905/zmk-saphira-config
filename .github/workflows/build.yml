name: Build ZMK Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install West and Dependencies
        run: |
          pip install west
          pip install sh

      - name: Initialize West Workspace
        run: |
          west init -l config || true
          west update
          west zephyr-export

      - name: Build Saphira UF2
        run: |
          west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=saphira -DZMK_CONFIG="$(pwd)/config"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saphira-firmware
          path: build/zephyr/zmk.uf2
