name: Build ZMK Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache west modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.west
            bootloader
            modules
            tools
            zephyr
            zmk
          key: ${{ runner.os }}-build-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Initialize West
        run: |
          west init -l config || true
          west update
          west zephyr-export

      - name: Build Saphira UF2
        run: |
          west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=saphira -DZMK_CONFIG="$(pwd)/config"

      - name: Archive artifacts
        uses: actions/upload-artifact@v3
        with:
          name: saphira-firmware
          path: build/zephyr/zmk.uf2
